version: '3.8'

services:
  yuanxing:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - ./data/output:/app/backend/output
      - ./data/uploads:/app/backend/uploads
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - yuanxing
    restart: unless-stopped
